# Copy .env.example to .env and maintain deployment values there.
name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME in .env; preserve the existing name on upgrades}
services:
  mysql:
    image: ${MYSQL_IMAGE:?Set MYSQL_IMAGE in .env}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysqladmin ping --host=127.0.0.1 --user=\"$${MYSQL_USER}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  zrlog:
    image: ${ZRLOG_IMAGE:?Set ZRLOG_IMAGE in .env}
    restart: unless-stopped
    init: true
    environment:
      ZRLOG_UPDATER_URL: http://updater:8081
      ZRLOG_UPDATER_TOKEN: ${ZRLOG_UPDATER_TOKEN:?Set a random ZRLOG_UPDATER_TOKEN in .env}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - conf:/opt/zrlog/conf
      - static:/opt/zrlog/static
    ports:
      - target: 8080
        published: "${ZRLOG_PORT:?Set ZRLOG_PORT in .env}"
        host_ip: ${ZRLOG_BIND_ADDRESS:?Set ZRLOG_BIND_ADDRESS in .env}
        protocol: tcp
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:8080/api/public/version"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  updater:
    image: ${ZRLOG_UPDATER_IMAGE:?Set ZRLOG_UPDATER_IMAGE in .env}
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      UPDATER_TOKEN: ${ZRLOG_UPDATER_TOKEN:?Set a random ZRLOG_UPDATER_TOKEN in .env}
      UPDATER_PROJECT: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME; preserve the existing name on upgrades}
      UPDATER_DEPLOYMENT_DIR: ${ZRLOG_DEPLOYMENT_DIR:?Set the absolute host deployment path in .env}
      UPDATER_COMPOSE_FILES: ${ZRLOG_COMPOSE_FILES:?Set ZRLOG_COMPOSE_FILES in .env}
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: bind
        source: ${ZRLOG_DEPLOYMENT_DIR:?Set ZRLOG_DEPLOYMENT_DIR}
        target: ${ZRLOG_DEPLOYMENT_DIR:?Set ZRLOG_DEPLOYMENT_DIR}
      - updater-state:/var/lib/zrlog-updater
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "/usr/local/bin/zrlog-updater", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql-data:
  conf:
  static:
  updater-state:
