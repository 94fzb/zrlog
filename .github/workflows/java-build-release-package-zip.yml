name: build release zip & war
on:
  push:
    branches: [release]
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  build:
    uses: ./.github/workflows/build-package.yml
    with:
      package_type: java
      source_commit: ${{ github.sha }}
      channel: release
      full_platforms: true
      publish: true
    secrets:
      SECRET_ID: ${{ secrets.SECRET_ID }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      BUCKET: ${{ secrets.BUCKET }}
      HOST: ${{ secrets.HOST }}
