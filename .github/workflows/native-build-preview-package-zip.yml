name: build native preview package and docker image
on:
  push:
    branches: [master]
  repository_dispatch:
    types: [zrlog-admin-web-preview-updated]
  workflow_dispatch:
    inputs:
      full_platforms:
        description: Build every supported platform instead of Linux amd64 only
        type: boolean
        default: false
      channel:
        description: Package mode (manual builds only archive Actions artifacts)
        type: choice
        options: [preview, release]
        default: preview
permissions:
  contents: read
  actions: read
jobs:
  build:
    uses: ./.github/workflows/build-package.yml
    with:
      package_type: native
      source_commit: ${{ github.sha }}
      channel: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'preview' }}
      full_platforms: ${{ github.event_name == 'workflow_dispatch' && inputs.full_platforms || false }}
      publish: ${{ github.event_name != 'workflow_dispatch' }}
      build_id: ${{ github.event.client_payload.build_id || '' }}
      build_time: ${{ github.event.client_payload.build_time || '' }}
    secrets:
      SECRET_ID: ${{ github.event_name != 'workflow_dispatch' && secrets.SECRET_ID || '' }}
      SECRET_KEY: ${{ github.event_name != 'workflow_dispatch' && secrets.SECRET_KEY || '' }}
      BUCKET: ${{ github.event_name != 'workflow_dispatch' && secrets.BUCKET || '' }}
      HOST: ${{ github.event_name != 'workflow_dispatch' && secrets.HOST || '' }}

  docker:
    name: Publish preview Docker image
    needs: build
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: docker-preview-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Require the current Native snapshot
        env:
          NATIVE_ARTIFACT_ID: ${{ needs.build.outputs.docker_artifact_id }}
        run: test -n "$NATIVE_ARTIFACT_ID"
      - uses: ./.github/actions/publish-preview-docker
        with:
          native-run-id: ${{ github.run_id }}
          native-artifact-id: ${{ needs.build.outputs.docker_artifact_id }}
          github-token: ${{ github.token }}
          docker-password: ${{ secrets.DOCKER_PASSWORD }}
          aliyun-docker-password: ${{ secrets.ALIYUN_DOCKER_PASSWORD }}
          secret-id: ${{ secrets.SECRET_ID }}
          secret-key: ${{ secrets.SECRET_KEY }}
          bucket: ${{ secrets.BUCKET }}
          host: ${{ secrets.HOST }}
