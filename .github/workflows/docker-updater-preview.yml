name: Standalone updater preview

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      push_image:
        required: true
        type: boolean
    secrets:
      DOCKER_PASSWORD:
        required: false
      ALIYUN_DOCKER_PASSWORD:
        required: false

permissions:
  contents: read
  id-token: write

env:
  DOCKERHUB_IMAGE: zrlog/zrlog-updater
  ALIYUN_IMAGE: registry.cn-chengdu.aliyuncs.com/hibegin/zrlog-updater

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Fix preview identity
        id: identity
        run: |
          python3 - <<'PY'
          import os, re, subprocess, xml.etree.ElementTree as ET
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          revision = ET.parse('docker/updater/pom.xml').findtext(
              './{*}properties/{*}revision')
          base = revision.removesuffix('-SNAPSHOT')
          assert re.fullmatch(r'\d+\.\d+\.\d+', base), revision
          version = f"{base}-preview.{commit[:12]}.{os.environ['GITHUB_RUN_ID']}.{os.environ['GITHUB_RUN_ATTEMPT']}"
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'commit={commit}\nversion={version}\n')
          PY

  build:
    name: Updater preview (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: graalvm
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Test with real Docker and compile Native updater
        env:
          ZRLOG_UPDATER_REAL_DOCKER: '1'
        run: |
          ./mvnw -B -f docker/updater/pom.xml -Pnative "-Drevision=${VERSION}" package
          python3 docker/updater/smoke-native.py docker/updater/target/zrlog-updater
          [[ $(docker/updater/target/zrlog-updater --version) == "zrlog-updater ${VERSION}" ]]
      - name: Verify local container and bundled clients
        run: |
          docker build --tag zrlog-updater:verified \
            --build-arg "ZRLOG_UPDATER_VERSION=${VERSION}" \
            --build-arg "ZRLOG_UPDATER_COMMIT=${SOURCE_COMMIT}" docker/updater
          [[ $(docker run --rm zrlog-updater:verified --version) == "zrlog-updater ${VERSION}" ]]
          docker run --rm --entrypoint docker zrlog-updater:verified --version
          docker run --rm --entrypoint docker zrlog-updater:verified compose version
      - uses: docker/login-action@v4.6.0
        if: inputs.push_image
        with:
          username: zrlog
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/login-action@v4.6.0
        if: inputs.push_image
        with:
          registry: registry.cn-chengdu.aliyuncs.com
          username: 90xchun
          password: ${{ secrets.ALIYUN_DOCKER_PASSWORD }}
      - name: Push Docker Hub image by digest
        id: dockerhub
        if: inputs.push_image
        uses: docker/build-push-action@v7
        with:
          context: ./docker/updater
          platforms: linux/${{ matrix.arch }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ env.DOCKERHUB_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            ZRLOG_UPDATER_VERSION=${{ env.VERSION }}
            ZRLOG_UPDATER_COMMIT=${{ env.SOURCE_COMMIT }}
      - name: Push Aliyun image by digest
        id: aliyun
        if: inputs.push_image
        uses: docker/build-push-action@v7
        with:
          context: ./docker/updater
          platforms: linux/${{ matrix.arch }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.ALIYUN_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            ZRLOG_UPDATER_VERSION=${{ env.VERSION }}
            ZRLOG_UPDATER_COMMIT=${{ env.SOURCE_COMMIT }}
      - name: Pull and verify both published images
        if: inputs.push_image
        env:
          DOCKERHUB_DIGEST: ${{ steps.dockerhub.outputs.digest }}
          ALIYUN_DIGEST: ${{ steps.aliyun.outputs.digest }}
        run: |
          set -euo pipefail
          for ref in "${DOCKERHUB_IMAGE}@${DOCKERHUB_DIGEST}" "${ALIYUN_IMAGE}@${ALIYUN_DIGEST}"; do
            docker pull --platform "linux/${ARCH}" "${ref}"
            [[ $(docker run --rm "${ref}" --version) == "zrlog-updater ${VERSION}" ]]
            docker image inspect "${ref}" | jq -e --arg version "${VERSION}" --arg commit "${SOURCE_COMMIT}" \
              '.[0].Config.Labels | .["org.opencontainers.image.version"] == $version and .["org.opencontainers.image.revision"] == $commit'
            container=$(docker create "${ref}" --version)
            docker cp "${container}:/usr/local/bin/zrlog-updater" /tmp/published-updater
            docker rm "${container}"
            python3 docker/updater/smoke-native.py /tmp/published-updater
          done
          mkdir -p /tmp/updater-digests
          jq -n --arg dockerhub "${DOCKERHUB_DIGEST}" --arg aliyun "${ALIYUN_DIGEST}" \
            '{dockerhub: $dockerhub, aliyun: $aliyun}' > "/tmp/updater-digests/${ARCH}.json"
      - uses: actions/upload-artifact@v7
        if: inputs.push_image
        with:
          name: updater-preview-digest-${{ matrix.arch }}-${{ github.run_attempt }}
          path: /tmp/updater-digests/*.json
          if-no-files-found: error

  publish:
    name: Publish and verify public updater preview
    needs: [prepare, build]
    if: inputs.push_image
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: sigstore/cosign-installer@v3
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/updater-digests
          pattern: updater-preview-digest-*-${{ github.run_attempt }}
          merge-multiple: true
      - uses: docker/login-action@v4.6.0
        with:
          username: zrlog
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/login-action@v4.6.0
        with:
          registry: registry.cn-chengdu.aliyuncs.com
          username: 90xchun
          password: ${{ secrets.ALIYUN_DOCKER_PASSWORD }}
      - name: Publish unique preview tags and signatures
        run: |
          set -euo pipefail
          mkdir -p /tmp/updater-publication
          for registry in dockerhub aliyun; do
            repository="${DOCKERHUB_IMAGE}"
            if [[ "${registry}" == aliyun ]]; then repository="${ALIYUN_IMAGE}"; fi
            sources=()
            for arch in amd64 arm64; do
              digest=$(jq -er --arg registry "${registry}" '.[$registry]' "/tmp/updater-digests/${arch}.json")
              [[ "${digest}" =~ ^sha256:[a-f0-9]{64}$ ]]
              sources+=("${repository}@${digest}")
            done
            docker buildx imagetools create --tag "${repository}:${VERSION}" "${sources[@]}"
            docker buildx imagetools inspect "${repository}:${VERSION}" --raw | jq -e \
              '([.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort) == ["amd64", "arm64"]'
            digest=$(docker buildx imagetools inspect "${repository}:${VERSION}" --format '{{.Manifest.Digest}}')
            cosign sign --yes "${repository}@${digest}"
            jq -n --arg image "${repository}:${VERSION}" --arg digest "${digest}" \
              --arg commit "${SOURCE_COMMIT}" --arg version "${VERSION}" \
              '{image: $image, digest: $digest, commit: $commit, version: $version, platforms: ["linux/amd64", "linux/arm64"]}' \
              > "/tmp/updater-publication/${registry}.json"
          done
      - name: Verify anonymous access and pull
        run: |
          set -euo pipefail
          docker logout
          docker logout registry.cn-chengdu.aliyuncs.com
          for repository in "${DOCKERHUB_IMAGE}" "${ALIYUN_IMAGE}"; do
            docker buildx imagetools inspect "${repository}:${VERSION}"
            docker pull --platform linux/amd64 "${repository}:${VERSION}"
            [[ $(docker run --rm "${repository}:${VERSION}" --version) == "zrlog-updater ${VERSION}" ]]
            printf '\n- `%s:%s`\n' "${repository}" "${VERSION}" >> "${GITHUB_STEP_SUMMARY}"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: updater-preview-publication-${{ github.run_attempt }}
          path: /tmp/updater-publication/*.json
          if-no-files-found: warn
