name: Docker metadata checks
on:
  pull_request:
    paths: ['docker/**', '.github/workflows/docker-*.yml', 'shell/release/*sources*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Application metadata and publication contract tests
        run: |
          bash docker/test-image-manifest.sh
          python3 shell/release/test_update_sources.py
          bash docker/test-native-package-contract.sh
          python3 docker/test-linux-image-assembly.py
  oci-roundtrip:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Check pinned OCI tooling
        run: bash docker/skopeo.sh --version
      - name: Verify OCI archive and index publication against isolated registries
        run: bash docker/test-linux-image-roundtrip.sh
