name: Docker metadata checks
on:
  pull_request:
    paths: ['docker/**', 'shell/docker/**', '.github/workflows/docker-*.yml', 'shell/release/*sources*']
  workflow_dispatch:
    inputs:
      producer_run_id:
        description: Optional completed package run whose actual Linux OCI archives should be verified
        type: string
        default: ''
permissions:
  contents: read
jobs:
  artifact-service-probe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Probe documented and configured FaaS service HTTPS endpoints
        env:
          CONFIGURED_URL: ${{ vars.ARTIFACT_SERVICE_URL }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          urls = list(dict.fromkeys([os.environ['CONFIGURED_URL'], 'https://artifact.zrlog.com/artifact']))
          records = []
          for index, base in enumerate(urls):
              output = Path(f'health-{index}.txt')
              result = subprocess.run(['curl', '--silent', '--show-error', '--max-time', '25',
                                       '--user-agent', 'ZrLog-Build-Verification/1.0',
                                       '--output', str(output), '--write-out', '%{http_code}',
                                       base.rstrip('/') + '/health'], capture_output=True, text=True)
              record = dict(url=base, curlExitCode=result.returncode, httpStatus=result.stdout,
                            error=result.stderr.strip(), body=output.read_text() if output.exists() else None)
              records.append(record)
              print(json.dumps(record))
          Path('service-probe.json').write_text(json.dumps(dict(records=records,
              qualification='Unauthenticated HTTPS health GET only; no TLS bypass, uploads, processing jobs or publication'), indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: faas-service-https-probe
          path: service-probe.json
  metadata:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Application metadata and publication contract tests
        run: |
          bash shell/docker/test-image-manifest.sh
          python3 shell/release/test_update_sources.py
          bash shell/docker/test-native-package-contract.sh
          python3 shell/docker/test-linux-image-assembly.py
  oci-roundtrip:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Check pinned OCI tooling
        run: bash shell/docker/skopeo.sh --version
      - name: Verify OCI archive and index publication against isolated registries
        run: bash shell/docker/test-linux-image-roundtrip.sh
  verify-producer-images:
    if: github.event_name == 'workflow_dispatch' && inputs.producer_run_id != ''
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      registry:
        image: registry:2
        ports: ['5000:5000']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Pin the completed package producer
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
        run: |
          [[ $PRODUCER_RUN_ID =~ ^[0-9]+$ ]]
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID" > producer-run.json
          jq -e --arg repository "$GITHUB_REPOSITORY" '
            .status == "completed" and .conclusion == "success" and
            .path == ".github/workflows/build-package.yml" and
            .repository.full_name == $repository and (.head_sha | test("^[0-9a-f]{40}$"))
          ' producer-run.json
      - name: Download the actual producer image archives
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.producer_run_id }}
          pattern: docker-linux-*
          path: .producer-images
      - name: Reassemble and copy the actual image bytes to isolated registries
        env:
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
        run: bash shell/docker/verify-producer-images.sh
      - name: Download all actual application package archives
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.producer_run_id }}
          pattern: package-*
          path: .producer-packages
      - name: Verify the complete package matrix and actual archive bytes
        env:
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
        run: |
          source_commit=$(jq -er .head_sha producer-run.json)
          channel=$(jq -er .channel .producer-verification/image-assembly.json)
          python3 shell/ci/verify-package-archives.py --inputs .producer-packages \
            --source "$source_commit" --producer-run "$PRODUCER_RUN_ID" --channel "$channel" \
            --output .producer-verification/package-verification.json
      - name: Preserve producer and verification identities
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verified-image-producer-${{ inputs.producer_run_id }}
          path: |
            producer-run.json
            .producer-verification/*.json
            .producer-verification/*.sha256
          include-hidden-files: true
          if-no-files-found: error
