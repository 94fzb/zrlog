name: build preview deb
on:
  push:
    branches: [master]
  repository_dispatch:
    types: [zrlog-admin-web-preview-updated]
  workflow_dispatch:
    inputs:
      full_platforms:
        description: Build every supported platform instead of Linux amd64 only
        type: boolean
        default: false
      channel:
        description: Package mode (manual builds only archive Actions artifacts)
        type: choice
        options: [preview, release]
        default: preview
permissions:
  contents: read
  actions: read
jobs:
  build:
    uses: ./.github/workflows/build-package.yml
    with:
      package_type: deb
      source_commit: ${{ github.sha }}
      channel: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'preview' }}
      full_platforms: ${{ github.event_name == 'workflow_dispatch' && inputs.full_platforms || false }}
      publish: ${{ github.event_name != 'workflow_dispatch' }}
      build_id: ${{ github.event.client_payload.build_id || '' }}
      build_time: ${{ github.event.client_payload.build_time || '' }}
    secrets:
      SECRET_ID: ${{ github.event_name != 'workflow_dispatch' && secrets.SECRET_ID || '' }}
      SECRET_KEY: ${{ github.event_name != 'workflow_dispatch' && secrets.SECRET_KEY || '' }}
      BUCKET: ${{ github.event_name != 'workflow_dispatch' && secrets.BUCKET || '' }}
      HOST: ${{ github.event_name != 'workflow_dispatch' && secrets.HOST || '' }}
