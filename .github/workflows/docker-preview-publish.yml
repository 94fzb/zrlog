name: build preview docker image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: ZrLog ref to build from
        required: false
        default: master
        type: string
      push_image:
        description: Push verified images and update metadata
        required: false
        default: false
        type: boolean
      native_run_id:
        description: Optional successful Docker updater Native acceptance run for the exact ref
        required: false
        default: ''
        type: string
      validate_windows:
        description: Build and verify the Windows Nano Server image
        required: false
        default: false
        type: boolean
      retire_legacy_repository:
        description: Delete the retired zrlog/zrlog-preview repository after validating replacement images
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
concurrency:
  group: docker-preview-publish
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve preview Native packages
    runs-on: ubuntu-latest
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.version.outputs.value }}
      image_tag: ${{ steps.image_tag.outputs.value }}
      linux_amd64_url: ${{ steps.native_linux_amd64.outputs.url }}
      linux_amd64_sha256: ${{ steps.native_linux_amd64.outputs.sha256 }}
      windows_x86_64_url: ${{ steps.native_windows_x86_64.outputs.url }}
      windows_x86_64_sha256: ${{ steps.native_windows_x86_64.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || 'master' }}

      - name: Record exact source commit
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Read ZrLog version
        id: version
        run: |
          version=$(awk '
              /<parent>/ { inParent = 1 }
              /<\/parent>/ { inParent = 0; next }
              !inParent && /<version>/ {
                  line = $0
                  sub(/.*<version>/, "", line)
                  sub(/<\/version>.*/, "", line)
                  print line
                  exit
              }
          ' pom.xml)
          : "${version:?project version is required}"
          echo "value=${version}" >> "${GITHUB_OUTPUT}"

      - name: Checkout publication tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Reuse verified Native acceptance artifact
        if: inputs.native_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN_ID: ${{ inputs.native_run_id }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          VERSION: ${{ steps.version.outputs.value }}
          VALIDATE_WINDOWS: ${{ inputs.validate_windows }}
        run: |
          [[ "$VALIDATE_WINDOWS" != true ]]
          bash docker/prepare-acceptance-package.sh "$NATIVE_RUN_ID" "$SOURCE_COMMIT" "$VERSION" .prepared-native
          cp .prepared-native/native-image-input.json native-image-input.json

      - name: Resolve Linux AMD64 Native package
        id: native_linux_amd64
        if: inputs.native_run_id == ''
        env:
          ZRLOG_NATIVE_METADATA_OUTPUT: native-image-input.json
          ZRLOG_EXPECTED_SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          ZRLOG_EXPECTED_VERSION: ${{ steps.version.outputs.value }}
          ZRLOG_NATIVE_MIRROR_BASE_URL: https://pub-c16cba848aff4e6b8d8e0d00f0f741f0.r2.dev
          ZRLOG_NATIVE_RESOLVE_ATTEMPTS: "30"
          ZRLOG_NATIVE_RESOLVE_RETRY_SECONDS: "30"
        run: >-
          bash docker/resolve-native-package.sh preview Linux-amd64
          https://pub-c16cba848aff4e6b8d8e0d00f0f741f0.r2.dev/preview/last.Linux-amd64.version.json

      - name: Resolve Windows x86_64 Native package
        id: native_windows_x86_64
        if: inputs.validate_windows && inputs.native_run_id == ''
        env:
          ZRLOG_EXPECTED_SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          ZRLOG_EXPECTED_VERSION: ${{ steps.version.outputs.value }}
          ZRLOG_NATIVE_MIRROR_BASE_URL: https://pub-c16cba848aff4e6b8d8e0d00f0f741f0.r2.dev
          ZRLOG_NATIVE_RESOLVE_ATTEMPTS: "30"
          ZRLOG_NATIVE_RESOLVE_RETRY_SECONDS: "30"
        run: >-
          bash docker/resolve-native-package.sh preview Windows-x86_64
          https://pub-c16cba848aff4e6b8d8e0d00f0f741f0.r2.dev/preview/last.Windows-x86_64.version.json

      - name: Use the actual package buildId for the Docker tag
        id: image_tag
        run: echo "value=$(bash docker/preview-image-tag.sh native-image-input.json)" >> "$GITHUB_OUTPUT"

      - name: Preserve validated Native metadata
        uses: actions/upload-artifact@v7
        with:
          name: docker-native-input-${{ github.run_attempt }}
          path: native-image-input.json
          if-no-files-found: error

      - name: Preserve verified executable
        if: inputs.native_run_id != ''
        uses: actions/upload-artifact@v7
        with:
          name: docker-native-package-${{ github.run_attempt }}
          path: .prepared-native
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  build:
    name: Build preview Docker image
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: inputs.push_image
        uses: docker/login-action@v4.6.0
        with:
          username: zrlog
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: actions/download-artifact@v8
        with:
          name: docker-native-input-${{ github.run_attempt }}
          path: .docker-metadata
      - uses: actions/download-artifact@v8
        if: inputs.native_run_id != ''
        with:
          name: docker-native-package-${{ github.run_attempt }}
          path: .prepared-native
      - name: Login to Aliyun
        if: inputs.push_image
        uses: docker/login-action@v4.6.0
        with:
          registry: registry.cn-chengdu.aliyuncs.com
          username: 90xchun
          password: ${{ secrets.ALIYUN_DOCKER_PASSWORD }}
      - name: Preserve existing immutable preview tags
        id: existing
        if: inputs.push_image
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
        run: |
          bash docker/preserve-preview-images.sh .docker-metadata/native-image-input.json "$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push
        if: inputs.native_run_id == '' && steps.existing.outputs.dockerhub != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: ${{ inputs.push_image }}
          build-args: |
            ZRLOG_CHANNEL=preview
            ZRLOG_NATIVE_ZIP_URL=${{ needs.prepare.outputs.linux_amd64_url }}
            ZRLOG_NATIVE_ZIP_SHA256=${{ needs.prepare.outputs.linux_amd64_sha256 }}
            ZRLOG_NATIVE_MIRROR_BASE_URL=https://pub-c16cba848aff4e6b8d8e0d00f0f741f0.r2.dev
            ZRLOG_EXPECTED_VERSION=${{ needs.prepare.outputs.version }}
            ZRLOG_SOURCE_COMMIT=${{ needs.prepare.outputs.source_commit }}
            CACHE_BUST=${{ github.run_id }}-${{ github.run_attempt }}
          tags: |
            zrlog/zrlog:${{ needs.prepare.outputs.image_tag }}

      - name: Build and push verified acceptance package
        if: inputs.native_run_id != '' && steps.existing.outputs.dockerhub != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .prepared-native/package
          file: docker/Dockerfile.package
          platforms: linux/amd64
          push: ${{ inputs.push_image }}
          build-args: |
            ZRLOG_EXPECTED_VERSION=${{ needs.prepare.outputs.version }}
            ZRLOG_SOURCE_COMMIT=${{ needs.prepare.outputs.source_commit }}
          tags: |
            zrlog/zrlog:${{ needs.prepare.outputs.image_tag }}

      - name: Publish compatible Aliyun preview index
        if: inputs.push_image && steps.existing.outputs.aliyun != 'true'
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
        run: |
          hub=zrlog/zrlog
          aliyun=registry.cn-chengdu.aliyuncs.com/hibegin/zrlog
          digest=$(docker buildx imagetools inspect "$hub:$IMAGE_TAG" --format '{{.Manifest.Digest}}')
          # Aliyun does not accept BuildKit OCI attestation manifests. Copy the
          # runtime image through Docker, preserving layers/config; retain Hub provenance.
          docker pull --platform linux/amd64 "$hub@$digest"
          docker tag "$hub@$digest" "$aliyun:$IMAGE_TAG-amd64"
          docker push "$aliyun:$IMAGE_TAG-amd64"
          runtime_digest=$(docker buildx imagetools inspect "$aliyun:$IMAGE_TAG-amd64" --format '{{.Manifest.Digest}}')
          docker buildx imagetools create --tag "$aliyun:$IMAGE_TAG" "$aliyun@$runtime_digest"

      - name: Verify published preview images and collect metadata
        if: inputs.push_image
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
          EXPECTED_COMMIT: ${{ needs.prepare.outputs.source_commit }}
        run: |
          refs=()
          anonymous=$(mktemp -d)
          trap 'rm -rf "$anonymous"' EXIT
          for repository in zrlog/zrlog registry.cn-chengdu.aliyuncs.com/hibegin/zrlog; do
            digest=$(docker buildx imagetools inspect "${repository}:${IMAGE_TAG}" --format '{{.Manifest.Digest}}')
            reference="${repository}@${digest}"
            docker --config "$anonymous" pull --platform linux/amd64 "${reference}"
            output=$(docker run --rm --entrypoint /opt/zrlog/zrlog "${reference}" --version)
            build_id=$(jq -r .buildId .docker-metadata/native-image-input.json)
            output="${output/ version: / version:}"
            [[ "${output}" == "zrlog version:${EXPECTED_VERSION} - ${build_id} "* ]]
            [[ $(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "${reference}") == "${EXPECTED_COMMIT}" ]]
            if [[ -f .prepared-native/package/zrlog ]]; then
              expected_sha=$(sha256sum .prepared-native/package/zrlog | cut -d ' ' -f 1)
              actual_sha=$(docker run --rm --entrypoint sha256sum "${reference}" /opt/zrlog/zrlog | cut -d ' ' -f 1)
              [[ "$actual_sha" == "$expected_sha" ]]
            fi
            refs+=(--image "${reference}")
          done
          bash docker/collect-image-manifest.sh \
            --native-metadata .docker-metadata/native-image-input.json \
            --channel preview --tag "${IMAGE_TAG}" "${refs[@]}" \
            --platform linux/amd64 --output .docker-metadata/last.docker-image.version.json
      - name: Publish preview update metadata after image verification
        if: inputs.push_image
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SECRET_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_KEY }}
          ZRLOG_S3_BUCKET: ${{ secrets.BUCKET }}
          ZRLOG_S3_ENDPOINT: ${{ secrets.HOST }}
        run: |
          bash docker/publish-image-manifest.sh .docker-metadata/last.docker-image.version.json \
            --allow-tag-alias-update > .docker-metadata/publication.json

      - name: Advance verified preview aliases in both registries
        if: inputs.push_image
        run: |
          jq -r '.images[] | [.repository,.digest] | @tsv' .docker-metadata/last.docker-image.version.json |
          while IFS=$'\t' read -r repository digest; do
            docker buildx imagetools create --tag "$repository:preview" "$repository@$digest"
            [[ $(docker buildx imagetools inspect "$repository:preview" --format '{{.Manifest.Digest}}') == "$digest" ]]
          done

      - name: Retire old preview repository after replacement verification
        if: inputs.push_image && inputs.retire_legacy_repository
        env:
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: bash docker/retire-preview-repository.sh --delete-zrlog-preview

      - name: Verify public Docker metadata
        if: inputs.push_image
        run: |
          manifest=.docker-metadata/last.docker-image.version.json
          for path in "$(jq -r .immutableKey .docker-metadata/publication.json)" preview/last.docker-image.version.json; do
            if ! curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
              --connect-timeout 15 --max-time 120 -D /tmp/public-metadata.headers \
              "https://dl.zrlog.com/$path" -o .docker-metadata/public.json; then
              grep -Ei '^HTTP/|^server:|^cf-mitigated:' /tmp/public-metadata.headers >&2 || true
              exit 1
            fi
            cmp "$manifest" .docker-metadata/public.json
          done

      - name: Preserve publication evidence
        if: always() && inputs.push_image
        uses: actions/upload-artifact@v7
        with:
          name: docker-preview-publication-${{ github.run_attempt }}
          path: .docker-metadata/*.json
          if-no-files-found: warn
          include-hidden-files: true

  validate-windows:
    name: Validate preview Windows image
    needs: prepare
    if: inputs.validate_windows
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}

      - name: Build Windows image
        shell: pwsh
        env:
          ZRLOG_NATIVE_ZIP_URL: ${{ needs.prepare.outputs.windows_x86_64_url }}
          ZRLOG_NATIVE_ZIP_SHA256: ${{ needs.prepare.outputs.windows_x86_64_sha256 }}
          ZRLOG_NATIVE_MIRROR_BASE_URL: https://pub-c16cba848aff4e6b8d8e0d00f0f741f0.r2.dev
          ZRLOG_EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
          CACHE_BUST: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker build --file docker/Dockerfile.windows `
            --build-arg "ZRLOG_CHANNEL=preview" `
            --build-arg "ZRLOG_NATIVE_ZIP_URL=$env:ZRLOG_NATIVE_ZIP_URL" `
            --build-arg "ZRLOG_NATIVE_ZIP_SHA256=$env:ZRLOG_NATIVE_ZIP_SHA256" `
            --build-arg "ZRLOG_NATIVE_MIRROR_BASE_URL=$env:ZRLOG_NATIVE_MIRROR_BASE_URL" `
            --build-arg "ZRLOG_EXPECTED_VERSION=$env:ZRLOG_EXPECTED_VERSION" `
            --build-arg "CACHE_BUST=$env:CACHE_BUST" `
            --tag "zrlog-preview:windows-ltsc2022" `
            ./docker

      - name: Verify Windows image
        shell: pwsh
        env:
          ZRLOG_EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $image = "zrlog-preview:windows-ltsc2022"
          $output = docker run --rm `
            --entrypoint "C:/opt/zrlog/zrlog.exe" `
            $image `
            --version 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) {
            throw "zrlog.exe --version exited with code ${exitCode}"
          }
          $versionOutput = ($output -join [Environment]::NewLine).Trim().Replace(" version: ", " version:")
          $expectedPrefix = "zrlog.exe version:$env:ZRLOG_EXPECTED_VERSION - "
          if (-not $versionOutput.StartsWith($expectedPrefix, [StringComparison]::Ordinal)) {
            throw "zrlog.exe --version did not report expected version $env:ZRLOG_EXPECTED_VERSION"
          }

          $imageSizeRaw = docker image inspect --format '{{.Size}}' $image
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to inspect the Windows image size'
          }
          $imageSize = [int64]$imageSizeRaw
          $imageSizeMiB = [Math]::Round($imageSize / 1MB, 1)
          Write-Host "Windows image size: ${imageSizeMiB} MiB (${imageSize} bytes)"
          "### Windows image validation" >> $env:GITHUB_STEP_SUMMARY
          "- Version: ``$(($output -join ' ').Trim())``" >> $env:GITHUB_STEP_SUMMARY
          "- Local image size: ${imageSizeMiB} MiB (${imageSize} bytes)" >> $env:GITHUB_STEP_SUMMARY
