name: build preview docker image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: ZrLog ref to build from
        required: false
        default: master
        type: string
      push_image:
        description: Push verified images and update metadata
        required: false
        default: false
        type: boolean
      validate_windows:
        description: Build and verify the Windows Nano Server image
        required: false
        default: false
        type: boolean
      updater_only:
        description: Build and publish only the standalone updater preview
        required: false
        default: false
        type: boolean
      updater_verify_version:
        description: Only verify this existing updater preview (requires updater_only and push_image=false)
        required: false
        default: ''
        type: string

permissions:
  contents: read
concurrency:
  group: docker-preview-publish
  cancel-in-progress: false

jobs:
  updater-preview:
    if: inputs.updater_only
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/docker-updater-preview.yml
    with:
      ref: ${{ inputs.ref }}
      push_image: ${{ inputs.push_image }}
      verify_version: ${{ inputs.updater_verify_version }}
    secrets: inherit

  prepare:
    name: Resolve preview Native packages
    if: ${{ !inputs.updater_only }}
    runs-on: ubuntu-latest
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.version.outputs.value }}
      linux_amd64_url: ${{ steps.native_linux_amd64.outputs.url }}
      linux_amd64_sha256: ${{ steps.native_linux_amd64.outputs.sha256 }}
      windows_x86_64_url: ${{ steps.native_windows_x86_64.outputs.url }}
      windows_x86_64_sha256: ${{ steps.native_windows_x86_64.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || 'master' }}

      - name: Record exact source commit
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Read ZrLog version
        id: version
        run: |
          version=$(awk '
              /<parent>/ { inParent = 1 }
              /<\/parent>/ { inParent = 0; next }
              !inParent && /<version>/ {
                  line = $0
                  sub(/.*<version>/, "", line)
                  sub(/<\/version>.*/, "", line)
                  print line
                  exit
              }
          ' pom.xml)
          : "${version:?project version is required}"
          echo "value=${version}" >> "${GITHUB_OUTPUT}"

      - name: Resolve Linux AMD64 Native package
        id: native_linux_amd64
        env:
          ZRLOG_NATIVE_METADATA_OUTPUT: native-image-input.json
          ZRLOG_EXPECTED_SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          ZRLOG_EXPECTED_VERSION: ${{ steps.version.outputs.value }}
          ZRLOG_NATIVE_MIRROR_BASE_URL: https://pub-c16cba848aff4e6b8d8e0d00f0f741f0.r2.dev
          ZRLOG_NATIVE_RESOLVE_ATTEMPTS: "30"
          ZRLOG_NATIVE_RESOLVE_RETRY_SECONDS: "30"
        run: >-
          bash docker/resolve-native-package.sh preview Linux-amd64
          https://pub-c16cba848aff4e6b8d8e0d00f0f741f0.r2.dev/preview/last.Linux-amd64.version.json

      - name: Resolve Windows x86_64 Native package
        id: native_windows_x86_64
        if: inputs.validate_windows
        env:
          ZRLOG_EXPECTED_SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          ZRLOG_EXPECTED_VERSION: ${{ steps.version.outputs.value }}
          ZRLOG_NATIVE_MIRROR_BASE_URL: https://pub-c16cba848aff4e6b8d8e0d00f0f741f0.r2.dev
          ZRLOG_NATIVE_RESOLVE_ATTEMPTS: "30"
          ZRLOG_NATIVE_RESOLVE_RETRY_SECONDS: "30"
        run: >-
          bash docker/resolve-native-package.sh preview Windows-x86_64
          https://pub-c16cba848aff4e6b8d8e0d00f0f741f0.r2.dev/preview/last.Windows-x86_64.version.json

      - name: Preserve validated Native metadata
        uses: actions/upload-artifact@v7
        with:
          name: docker-native-input-${{ github.run_attempt }}
          path: native-image-input.json
          if-no-files-found: error

  build:
    name: Build preview Docker image
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: inputs.push_image
        uses: docker/login-action@v4.6.0
        with:
          username: zrlog
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: actions/download-artifact@v8
        with:
          name: docker-native-input-${{ github.run_attempt }}
          path: .docker-metadata
      - name: Login to Aliyun
        if: inputs.push_image
        uses: docker/login-action@v4.6.0
        with:
          registry: registry.cn-chengdu.aliyuncs.com
          username: 90xchun
          password: ${{ secrets.ALIYUN_DOCKER_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: ${{ inputs.push_image }}
          build-args: |
            ZRLOG_CHANNEL=preview
            ZRLOG_NATIVE_ZIP_URL=${{ needs.prepare.outputs.linux_amd64_url }}
            ZRLOG_NATIVE_ZIP_SHA256=${{ needs.prepare.outputs.linux_amd64_sha256 }}
            ZRLOG_NATIVE_MIRROR_BASE_URL=https://pub-c16cba848aff4e6b8d8e0d00f0f741f0.r2.dev
            ZRLOG_EXPECTED_VERSION=${{ needs.prepare.outputs.version }}
            ZRLOG_SOURCE_COMMIT=${{ needs.prepare.outputs.source_commit }}
            CACHE_BUST=${{ github.run_id }}-${{ github.run_attempt }}
          tags: |
            zrlog/zrlog-preview:latest
            zrlog/zrlog:${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.source_commit }}-preview
            registry.cn-chengdu.aliyuncs.com/hibegin/zrlog:${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.source_commit }}-preview

      - name: Verify published preview images and collect metadata
        if: inputs.push_image
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.source_commit }}-preview
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
          EXPECTED_COMMIT: ${{ needs.prepare.outputs.source_commit }}
        run: |
          refs=()
          for repository in zrlog/zrlog registry.cn-chengdu.aliyuncs.com/hibegin/zrlog; do
            digest=$(docker buildx imagetools inspect "${repository}:${IMAGE_TAG}" --format '{{.Manifest.Digest}}')
            reference="${repository}@${digest}"
            docker pull --platform linux/amd64 "${reference}"
            output=$(docker run --rm --entrypoint /opt/zrlog/zrlog "${reference}" --version)
            build_id=$(jq -r .buildId .docker-metadata/native-image-input.json)
            output="${output/ version: / version:}"
            [[ "${output}" == "zrlog version:${EXPECTED_VERSION} - ${build_id} "* ]]
            [[ $(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "${reference}") == "${EXPECTED_COMMIT}" ]]
            refs+=(--image "${reference}")
          done
          python3 docker/collect-image-manifest.py \
            --native-metadata .docker-metadata/native-image-input.json \
            --channel preview --tag "${IMAGE_TAG}" "${refs[@]}" \
            --platform linux/amd64 --output .docker-metadata/last.docker-image.version.json
      - name: Publish preview update metadata after image verification
        if: inputs.push_image
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SECRET_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_KEY }}
          ZRLOG_S3_BUCKET: ${{ secrets.BUCKET }}
          ZRLOG_S3_ENDPOINT: ${{ secrets.HOST }}
        run: |
          python3 -m pip install 'boto3>=1.40,<2'
          python3 docker/publish-image-manifest.py .docker-metadata/last.docker-image.version.json

  validate-windows:
    name: Validate preview Windows image
    needs: prepare
    if: inputs.validate_windows
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}

      - name: Build Windows image
        shell: pwsh
        env:
          ZRLOG_NATIVE_ZIP_URL: ${{ needs.prepare.outputs.windows_x86_64_url }}
          ZRLOG_NATIVE_ZIP_SHA256: ${{ needs.prepare.outputs.windows_x86_64_sha256 }}
          ZRLOG_NATIVE_MIRROR_BASE_URL: https://pub-c16cba848aff4e6b8d8e0d00f0f741f0.r2.dev
          ZRLOG_EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
          CACHE_BUST: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker build --file docker/Dockerfile.windows `
            --build-arg "ZRLOG_CHANNEL=preview" `
            --build-arg "ZRLOG_NATIVE_ZIP_URL=$env:ZRLOG_NATIVE_ZIP_URL" `
            --build-arg "ZRLOG_NATIVE_ZIP_SHA256=$env:ZRLOG_NATIVE_ZIP_SHA256" `
            --build-arg "ZRLOG_NATIVE_MIRROR_BASE_URL=$env:ZRLOG_NATIVE_MIRROR_BASE_URL" `
            --build-arg "ZRLOG_EXPECTED_VERSION=$env:ZRLOG_EXPECTED_VERSION" `
            --build-arg "CACHE_BUST=$env:CACHE_BUST" `
            --tag "zrlog-preview:windows-ltsc2022" `
            ./docker

      - name: Verify Windows image
        shell: pwsh
        env:
          ZRLOG_EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $image = "zrlog-preview:windows-ltsc2022"
          $output = docker run --rm `
            --entrypoint "C:/opt/zrlog/zrlog.exe" `
            $image `
            --version 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) {
            throw "zrlog.exe --version exited with code ${exitCode}"
          }
          $versionOutput = ($output -join [Environment]::NewLine).Trim().Replace(" version: ", " version:")
          $expectedPrefix = "zrlog.exe version:$env:ZRLOG_EXPECTED_VERSION - "
          if (-not $versionOutput.StartsWith($expectedPrefix, [StringComparison]::Ordinal)) {
            throw "zrlog.exe --version did not report expected version $env:ZRLOG_EXPECTED_VERSION"
          }

          $imageSizeRaw = docker image inspect --format '{{.Size}}' $image
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to inspect the Windows image size'
          }
          $imageSize = [int64]$imageSizeRaw
          $imageSizeMiB = [Math]::Round($imageSize / 1MB, 1)
          Write-Host "Windows image size: ${imageSizeMiB} MiB (${imageSize} bytes)"
          "### Windows image validation" >> $env:GITHUB_STEP_SUMMARY
          "- Version: ``$(($output -join ' ').Trim())``" >> $env:GITHUB_STEP_SUMMARY
          "- Local image size: ${imageSizeMiB} MiB (${imageSize} bytes)" >> $env:GITHUB_STEP_SUMMARY
