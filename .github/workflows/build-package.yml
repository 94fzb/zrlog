name: Build application packages
run-name: Build application packages (${{ github.sha }})

on:
  push:
    branches: [master, release]
  repository_dispatch:
    types: [zrlog-admin-web-preview-updated]
  workflow_dispatch:
    inputs:
      package_type:
        description: Package types to build
        type: choice
        options: [all, java, native, deb, faas]
        default: all
      full_platforms:
        description: Build every supported platform instead of Linux amd64 only
        type: boolean
        default: false
      channel:
        description: Package mode (manual builds only archive Actions artifacts)
        type: choice
        options: [preview, release]
        default: preview

permissions:
  contents: read
  actions: read
  id-token: write
  attestations: write

# Serialize channel publications, including image manifests. Manual runs are isolated.
concurrency:
  group: application-packages-${{ github.event_name != 'workflow_dispatch' && github.ref_name || github.run_id }}
  cancel-in-progress: false

env:
  DOCKERHUB_IMAGE: zrlog/zrlog
  ALIYUN_IMAGE: registry.cn-chengdu.aliyuncs.com/hibegin/zrlog

jobs:
  plan:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_packages: ${{ steps.plan.outputs.has_packages }}
      build_native: ${{ steps.plan.outputs.build_native }}
      channel: ${{ steps.plan.outputs.channel }}
      publish: ${{ steps.plan.outputs.publish }}
      full_platforms: ${{ steps.plan.outputs.full_platforms }}
      source_commit: ${{ steps.plan.outputs.source_commit }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select packages, channel and supported platforms
        id: plan
        env:
          PACKAGE_TYPE: ${{ inputs.package_type || 'all' }}
          CHANNEL: ${{ inputs.channel || 'preview' }}
          FULL_PLATFORMS: ${{ inputs.full_platforms || false }}
        run: python3 shell/ci/plan-package-build.py

  native_linux_amd64:
    name: ${{ matrix.package_type }} on ${{ matrix.os }}
    needs: plan
    if: needs.plan.outputs.build_native == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    defaults: &package_defaults
      run:
        shell: bash
    concurrency: &package_concurrency
      group: package-${{ needs.plan.outputs.publish == 'true' && 'publish' || github.run_id }}-${{ needs.plan.outputs.channel }}-${{ matrix.package_type }}-${{ matrix.os }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - {package_type: native, os: ubuntu-22.04, java: '25'}
    outputs:
      package_artifact_id: ${{ steps.package_artifact.outputs.artifact-id }}
    env: &package_env
      ZRLOG_BUILD_ID: ${{ github.event.client_payload.build_id || '' }}
      ZRLOG_BUILD_TIME: ${{ github.event.client_payload.build_time || '' }}
    steps: &package_steps
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the exact source
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
      - uses: actions/setup-java@v6
        if: matrix.package_type == 'java'
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - uses: graalvm/setup-graalvm@v1
        if: matrix.package_type != 'java'
        with:
          java-version: ${{ matrix.java }}
          distribution: graalvm
          cache: maven
          github-token: ${{ github.token }}
          native-image-job-reports: 'true'
      - uses: anchore/sbom-action/download-syft@v0
        if: needs.plan.outputs.publish == 'true'
      - uses: sigstore/cosign-installer@v3
        if: needs.plan.outputs.publish == 'true'
      - name: Build application package
        env:
          PACKAGE_TYPE: ${{ matrix.package_type }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
          ARTIFACT_SERVICE_URL: ${{ matrix.package_type == 'faas' && vars.ARTIFACT_SERVICE_URL || '' }}
          ARTIFACT_SERVICE_TOKEN: ${{ matrix.package_type == 'faas' && secrets.ARTIFACT_SERVICE_TOKEN || '' }}
        run: |
          mkdir -p .package-output
          case "$PACKAGE_TYPE" in
            java) bash -e shell/java/build-final-java.sh "$CHANNEL" .package-output ;;
            native) bash -e shell/native/build-final-native.sh "$CHANNEL" .package-output zip ;;
            deb|faas) bash -e shell/native/build-final-native.sh "$CHANNEL" .package-output "$PACKAGE_TYPE" ;;
          esac
      - name: Record the actual package bytes and build inputs
        env:
          PACKAGE_TYPE: ${{ matrix.package_type }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
          EXPECTED_COMMIT: ${{ github.sha }}
          REQUESTED_JAVA: ${{ matrix.java }}
        run: python3 shell/ci/record-package-build.py
      - name: Attest channel artifacts
        if: needs.plan.outputs.publish == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ github.workspace }}/.package-output/${{ needs.plan.outputs.channel }}/zrlog-*-${{ needs.plan.outputs.channel }}*.zip
            ${{ github.workspace }}/.package-output/${{ needs.plan.outputs.channel }}/zrlog-*-${{ needs.plan.outputs.channel }}*.war
            ${{ github.workspace }}/.package-output/${{ needs.plan.outputs.channel }}/zrlog-*-${{ needs.plan.outputs.channel }}*.deb
      - name: Generate channel trust metadata
        env:
          CHANNEL: ${{ needs.plan.outputs.channel }}
        if: needs.plan.outputs.publish == 'true'
        run: |
          python3 shell/release/generate_trust_metadata.py \
            --artifact-dir ".package-output/$CHANNEL" \
            --channel "$CHANNEL" \
            --source-commit "$(git rev-parse HEAD)" \
            --source-repository "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --workflow-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Upload channel artifacts
        if: needs.plan.outputs.publish == 'true'
        env:
          SECRET_ID: ${{ secrets.SECRET_ID }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          BUCKET: ${{ secrets.BUCKET }}
          HOST: ${{ secrets.HOST }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
        run: bash -e shell/upload-bin.sh "$SECRET_ID" "$SECRET_KEY" "$BUCKET" .package-output "$CHANNEL" "$HOST"
      - name: Preserve packages and build evidence
        id: package_artifact
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.package_type }}-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            .package-output
            .package-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Preserve Native compiler diagnostics on failure
        if: failure() && matrix.package_type != 'java'
        uses: actions/upload-artifact@v7
        with:
          name: native-diagnostics-${{ matrix.package_type }}-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            package/target/svm_err_*.md
            package/target/reports
            package/target/native/agent-output
          if-no-files-found: warn
          retention-days: 14

  native_linux_arm64:
    name: ${{ matrix.package_type }} on ${{ matrix.os }}
    needs: plan
    if: needs.plan.outputs.build_native == 'true' && needs.plan.outputs.full_platforms == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    defaults: *package_defaults
    concurrency: *package_concurrency
    strategy:
      fail-fast: false
      matrix:
        include:
          - {package_type: native, os: ubuntu-24.04-arm, java: '25'}
    outputs:
      package_artifact_id: ${{ steps.package_artifact.outputs.artifact-id }}
    env: *package_env
    steps: *package_steps

  native_windows:
    name: ${{ matrix.package_type }} on ${{ matrix.os }}
    needs: plan
    if: needs.plan.outputs.build_native == 'true' && needs.plan.outputs.full_platforms == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    defaults: *package_defaults
    concurrency: *package_concurrency
    strategy:
      fail-fast: false
      matrix:
        include:
          - {package_type: native, os: windows-2022, java: '25'}
    outputs:
      package_artifact_id: ${{ steps.package_artifact.outputs.artifact-id }}
    env: *package_env
    steps: *package_steps

  packages:
    name: ${{ matrix.package_type }} on ${{ matrix.os }}
    needs: plan
    if: needs.plan.outputs.has_packages == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    defaults: *package_defaults
    concurrency: *package_concurrency
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env: *package_env
    steps: *package_steps

  docker_linux_amd64:
    name: Docker Linux amd64
    needs: [plan, native_linux_amd64]
    if: needs.plan.outputs.build_native == 'true'
    runs-on: ${{ matrix.runner }}
    env: &docker_linux_env
      ZRLOG_EXPECTED_VERSION: ${{ needs.plan.outputs.version }}
      ZRLOG_EXPECTED_SOURCE_COMMIT: ${{ needs.plan.outputs.source_commit }}
      ZRLOG_CHANNEL: ${{ needs.plan.outputs.channel }}
      NATIVE_ARTIFACT_ID: ${{ join(needs.*.outputs.package_artifact_id, ',') }}
    outputs:
      native_input_id: ${{ steps.native_input.outputs.artifact-id }}
      digest_id: ${{ steps.digest.outputs.artifact-id }}
    strategy:
      matrix:
        include:
          - {runner: ubuntu-22.04, platform: linux/amd64, arch: amd64}
    steps: &docker_linux_steps
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.source_commit }}

      - name: Download the exact completed Native package
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ env.NATIVE_ARTIFACT_ID }}
          path: .native-package
          merge-multiple: true
      - name: Verify the actual Native package and prepare Docker context
        id: native
        env:
          NATIVE_PLATFORM: Linux-${{ matrix.arch }}
        run: python3 docker/prepare-workflow-package.py .native-package .prepared-native
      - name: Preserve validated Native build identity
        id: native_input
        uses: actions/upload-artifact@v7
        with:
          name: docker-native-input-${{ matrix.arch }}-${{ github.run_attempt }}
          path: |
            .prepared-native/native-image-input.json
            .prepared-native/native.sha256
          if-no-files-found: error
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: needs.plan.outputs.publish == 'true'
        uses: docker/login-action@v4.6.0
        with:
          username: zrlog
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to Aliyun Docker Hub
        if: needs.plan.outputs.publish == 'true'
        uses: docker/login-action@v4.6.0
        with:
          registry: registry.cn-chengdu.aliyuncs.com
          username: 90xchun
          password: ${{ secrets.ALIYUN_DOCKER_PASSWORD }}

      - name: Build Linux image for publication or archive
        id: push_dockerhub
        uses: docker/build-push-action@v7
        with:
          context: .prepared-native/package
          file: docker/Dockerfile.package
          platforms: ${{ matrix.platform }}
          provenance: ${{ needs.plan.outputs.publish == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ needs.plan.outputs.publish == 'true' }}
          tags: ${{ needs.plan.outputs.publish != 'true' && format('zrlog/zrlog:{0}-{1}', steps.native.outputs.image_tag, matrix.arch) || '' }}
          build-args: |
            ZRLOG_EXPECTED_VERSION=${{ env.ZRLOG_EXPECTED_VERSION }}
            ZRLOG_SOURCE_COMMIT=${{ needs.plan.outputs.source_commit }}
          outputs: >-
            ${{ needs.plan.outputs.publish == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.DOCKERHUB_IMAGE) || 'type=docker,dest=.prepared-native/image.tar' }}

      - name: Build and push immutable Linux image to Aliyun
        if: needs.plan.outputs.publish == 'true'
        id: push_aliyun
        uses: docker/build-push-action@v7
        with:
          context: .prepared-native/package
          file: docker/Dockerfile.package
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false
          build-args: |
            ZRLOG_EXPECTED_VERSION=${{ env.ZRLOG_EXPECTED_VERSION }}
            ZRLOG_SOURCE_COMMIT=${{ needs.plan.outputs.source_commit }}
          outputs: >-
            type=image,name=${{ env.ALIYUN_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Resolve and compare Linux image digests
        if: needs.plan.outputs.publish == 'true'
        id: image
        env:
          ARCH: ${{ matrix.arch }}
          DOCKERHUB_OUTPUT_DIGEST: ${{ steps.push_dockerhub.outputs.digest }}
          ALIYUN_DIGEST: ${{ steps.push_aliyun.outputs.digest }}
        run: |
          set -euo pipefail
          : "${DOCKERHUB_OUTPUT_DIGEST:?Docker Hub output digest is required}"
          : "${ALIYUN_DIGEST:?Aliyun image digest is required}"

          dockerhub_manifest=$(docker buildx imagetools inspect \
            "${DOCKERHUB_IMAGE}@${DOCKERHUB_OUTPUT_DIGEST}" --raw)
          dockerhub_image_digest=$(jq -r --arg arch "${ARCH}" '
            [.manifests[]?
              | select(.platform.os == "linux" and .platform.architecture == $arch)
              | .digest]
            | if length == 1 then .[0] else empty end
          ' <<<"${dockerhub_manifest}")
          if [[ -z "${dockerhub_image_digest}" ]]; then
            dockerhub_image_digest="${DOCKERHUB_OUTPUT_DIGEST}"
          fi
          if [[ "${dockerhub_image_digest}" != "${ALIYUN_DIGEST}" ]]; then
            echo "Linux image digest differs between registries" >&2
            exit 1
          fi
          echo "digest=${dockerhub_image_digest}" >> "${GITHUB_OUTPUT}"

      - name: Verify pushed Linux image
        if: needs.plan.outputs.publish == 'true'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          EXPECTED_COMMIT: ${{ needs.plan.outputs.source_commit }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          : "${IMAGE_DIGEST:?image digest is required}"
          build_id=$(jq -r .buildId .prepared-native/native-image-input.json)
          for repository in "${DOCKERHUB_IMAGE}" "${ALIYUN_IMAGE}"; do
            reference="${repository}@${IMAGE_DIGEST}"
            docker pull --platform "${PLATFORM}" "${reference}"
            version_output=$(docker run --rm --platform "${PLATFORM}" --entrypoint /opt/zrlog/zrlog "${reference}" --version)
            version_output="${version_output/ version: / version:}"
            [[ "${version_output}" == "zrlog version:${ZRLOG_EXPECTED_VERSION} - ${build_id} "* ]]
            docker image inspect "${reference}" | jq -e --arg version "${ZRLOG_EXPECTED_VERSION}" --arg commit "${EXPECTED_COMMIT}" \
              '.[0].Config.Labels | .["org.opencontainers.image.version"] == $version and .["org.opencontainers.image.revision"] == $commit'
            expected_sha=$(cut -d ' ' -f 1 .prepared-native/native.sha256)
            actual_sha=$(docker run --rm --platform "$PLATFORM" --entrypoint sha256sum "$reference" /opt/zrlog/zrlog | cut -d ' ' -f 1)
            [[ $actual_sha == "$expected_sha" ]]
          done

      - name: Export Linux image digest
        if: needs.plan.outputs.publish == 'true'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          DOCKERHUB_INDEX_DIGEST: ${{ steps.push_dockerhub.outputs.digest }}
        run: |
          : "${IMAGE_DIGEST:?image digest is required}"
          mkdir -p /tmp/digests
          printf '%s\n' "$DOCKERHUB_INDEX_DIGEST" > "/tmp/digests/${IMAGE_DIGEST#sha256:}"

      - name: Upload Linux image digest
        id: digest
        if: needs.plan.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: linux-digest-${{ matrix.arch }}-${{ github.run_attempt }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 14

      - name: Record archived Linux image checksum
        if: needs.plan.outputs.publish != 'true'
        run: (cd .prepared-native && sha256sum image.tar > image.sha256)
      - name: Preserve Linux image archive and Native inputs
        uses: actions/upload-artifact@v7
        with:
          name: docker-linux-${{ matrix.arch }}-${{ needs.plan.outputs.channel }}-${{ github.run_attempt }}
          path: |
            .prepared-native/image.tar
            .prepared-native/image.sha256
            .prepared-native/native-image-input.json
            .prepared-native/build.json
            .prepared-native/native.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14


  docker_linux_arm64:
    name: Docker Linux arm64
    needs: [plan, native_linux_arm64]
    if: needs.plan.outputs.build_native == 'true' && needs.plan.outputs.full_platforms == 'true'
    runs-on: ${{ matrix.runner }}
    env: *docker_linux_env
    outputs:
      native_input_id: ${{ steps.native_input.outputs.artifact-id }}
      digest_id: ${{ steps.digest.outputs.artifact-id }}
    strategy:
      matrix:
        include:
          - {runner: ubuntu-24.04-arm, platform: linux/arm64, arch: arm64}
    steps: *docker_linux_steps

  docker_linux_manifest:
    name: Publish Linux image manifest
    needs:
      - plan
      - docker_linux_amd64
      - docker_linux_arm64
    runs-on: ubuntu-22.04
    if: >-
      !cancelled() && needs.plan.outputs.publish == 'true' &&
      needs.docker_linux_amd64.result == 'success' &&
      (needs.docker_linux_arm64.result == 'success' ||
       (needs.plan.outputs.full_platforms != 'true' && needs.docker_linux_arm64.result == 'skipped'))
    env:
      CHANNEL: ${{ needs.plan.outputs.channel }}
      FULL_PLATFORMS: ${{ needs.plan.outputs.full_platforms }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.source_commit }}
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.docker_linux_amd64.outputs.native_input_id }}
          merge-multiple: true
          path: .docker-metadata
      - name: Download Linux image digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          artifact-ids: ${{ needs.plan.outputs.full_platforms == 'true' && format('{0},{1}', needs.docker_linux_amd64.outputs.digest_id, needs.docker_linux_arm64.outputs.digest_id) || needs.docker_linux_amd64.outputs.digest_id }}
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - uses: sigstore/cosign-installer@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: zrlog
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to Aliyun Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          registry: registry.cn-chengdu.aliyuncs.com
          username: 90xchun
          password: ${{ secrets.ALIYUN_DOCKER_PASSWORD }}

      - name: Create and verify Linux manifests
        id: manifest
        run: |
          set -euo pipefail
          version=$(jq -er .version .docker-metadata/native-image-input.json)
          if [[ $CHANNEL == preview ]]; then
            DOCKER_TAG_VERSION=$(bash docker/preview-image-tag.sh .docker-metadata/native-image-input.json)
            alias=preview
          else
            DOCKER_TAG_VERSION=$version
            alias=latest
          fi
          echo "DOCKER_TAG_VERSION=$DOCKER_TAG_VERSION" >> "$GITHUB_ENV"
          echo "DOCKER_ALIAS=$alias" >> "$GITHUB_ENV"
          expected_count=1
          expected_platforms='["linux/amd64"]'
          if [[ $FULL_PLATFORMS == true ]]; then
            expected_count=2
            expected_platforms='["linux/amd64","linux/arm64"]'
          fi
          mapfile -t digest_files < <(find /tmp/digests -maxdepth 1 -type f -printf '%f\n' | sort)
          if [[ "${#digest_files[@]}" -ne "$expected_count" ]]; then
            echo "Unexpected number of Linux image digests: ${#digest_files[@]}" >&2
            exit 1
          fi

          dockerhub_sources=()
          aliyun_sources=()
          for digest_file in "${digest_files[@]}"; do
            digest="sha256:${digest_file}"
            hub_digest=$(cat "/tmp/digests/$digest_file")
            [[ $hub_digest =~ ^sha256:[0-9a-f]{64}$ ]]
            dockerhub_source="${DOCKERHUB_IMAGE}@${hub_digest}"
            aliyun_source="${ALIYUN_IMAGE}@${digest}"
            docker buildx imagetools inspect "${dockerhub_source}" >/dev/null
            docker buildx imagetools inspect "${aliyun_source}" >/dev/null
            dockerhub_sources+=("${dockerhub_source}")
            aliyun_sources+=("${aliyun_source}")
          done

          # Protect immutable version/buildId tags in both channels on reruns.
          publish_index() {
            local repository=$1
            shift
            local reference="$repository:$DOCKER_TAG_VERSION"
            if docker buildx imagetools inspect "$reference" --raw > /tmp/existing-index.json 2> /tmp/inspect-error; then
              existing=$(jq -c '[.manifests[] | select(.platform.os == "linux") | .digest] | sort' /tmp/existing-index.json)
              expected=$(printf '%s\n' "${digest_files[@]}" | jq -Rsc 'split("\n")[:-1] | map("sha256:" + .) | sort')
              [[ $existing == "$expected" ]] || { echo "Immutable image already differs: $reference" >&2; return 1; }
            else
              grep -Eqi 'not found|manifest unknown' /tmp/inspect-error || { cat /tmp/inspect-error >&2; return 1; }
              docker buildx imagetools create --tag "$reference" "$@"
            fi
          }
          publish_index "$DOCKERHUB_IMAGE" "${dockerhub_sources[@]}"
          publish_index "$ALIYUN_IMAGE" "${aliyun_sources[@]}"

          validate_manifest() {
            local image="$1"
            docker buildx imagetools inspect "${image}" --raw | jq -e --argjson expected "$expected_platforms" '
              ([.manifests[]
                | select(.platform.os == "linux")
                | "\(.platform.os)/\(.platform.architecture)"] | sort)
              == $expected
            ' >/dev/null
          }
          validate_manifest "${DOCKERHUB_IMAGE}:${DOCKER_TAG_VERSION}"
          validate_manifest "${ALIYUN_IMAGE}:${DOCKER_TAG_VERSION}"

          platform_digests() {
            local image="$1"
            docker buildx imagetools inspect "${image}" --raw | jq -cS '
              [.manifests[]
                | select(.platform.os == "linux")
                | {
                    platform: "\(.platform.os)/\(.platform.architecture)",
                    digest: .digest
                  }]
              | sort_by(.platform)
            '
          }
          dockerhub_platforms=$(platform_digests "${DOCKERHUB_IMAGE}:${DOCKER_TAG_VERSION}")
          aliyun_platforms=$(platform_digests "${ALIYUN_IMAGE}:${DOCKER_TAG_VERSION}")
          if [[ "${dockerhub_platforms}" != "${aliyun_platforms}" ]]; then
            echo "Linux platform digests differ between registries" >&2
            exit 1
          fi

          dockerhub_digest=$(docker buildx imagetools inspect \
            "${DOCKERHUB_IMAGE}:${DOCKER_TAG_VERSION}" --format '{{.Manifest.Digest}}')
          aliyun_digest=$(docker buildx imagetools inspect \
            "${ALIYUN_IMAGE}:${DOCKER_TAG_VERSION}" --format '{{.Manifest.Digest}}')
          echo "Docker Hub manifest: ${DOCKERHUB_IMAGE}@${dockerhub_digest}"
          echo "Aliyun manifest: ${ALIYUN_IMAGE}@${aliyun_digest}"
          echo "dockerhub=${DOCKERHUB_IMAGE}@${dockerhub_digest}" >> "${GITHUB_OUTPUT}"
          echo "aliyun=${ALIYUN_IMAGE}@${aliyun_digest}" >> "${GITHUB_OUTPUT}"

      - name: Inspect published Linux image
        run: |
          docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:${DOCKER_TAG_VERSION}"
          docker buildx imagetools inspect "${ALIYUN_IMAGE}:${DOCKER_TAG_VERSION}"

      - name: Sign canonical Docker image
        run: cosign sign --yes "${{ steps.manifest.outputs.dockerhub }}"

      - name: Generate Docker update metadata
        env:
          DOCKERHUB_REF: ${{ steps.manifest.outputs.dockerhub }}
          ALIYUN_REF: ${{ steps.manifest.outputs.aliyun }}
        run: |
          platforms=(--platform linux/amd64)
          [[ $FULL_PLATFORMS != true ]] || platforms+=(--platform linux/arm64)
          bash docker/collect-image-manifest.sh \
            --native-metadata .docker-metadata/native-image-input.json \
            --channel "$CHANNEL" --tag "${DOCKER_TAG_VERSION}" \
            --image "${DOCKERHUB_REF}" --image "${ALIYUN_REF}" \
            "${platforms[@]}" \
            --output .docker-metadata/last.docker-image.version.json
      - name: Publish Docker update metadata after image verification
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SECRET_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_KEY }}
          ZRLOG_S3_BUCKET: ${{ secrets.BUCKET }}
          ZRLOG_S3_ENDPOINT: ${{ secrets.HOST }}
        run: |
          bash docker/publish-image-manifest.sh .docker-metadata/last.docker-image.version.json


      - name: Advance verified channel aliases
        run: |
          for repository in "$DOCKERHUB_IMAGE" "$ALIYUN_IMAGE"; do
            digest=$(docker buildx imagetools inspect "$repository:$DOCKER_TAG_VERSION" --format '{{.Manifest.Digest}}')
            docker buildx imagetools create --tag "$repository:$DOCKER_ALIAS" "$repository@$digest"
            [[ $(docker buildx imagetools inspect "$repository:$DOCKER_ALIAS" --format '{{.Manifest.Digest}}') == "$digest" ]]
          done
      - name: Preserve image publication metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-linux-publication-${{ github.run_attempt }}
          path: .docker-metadata/*.json
          if-no-files-found: warn
          include-hidden-files: true

  docker_windows:
    name: Build Windows image (windows/amd64)
    needs: [plan, native_windows]
    if: needs.plan.outputs.build_native == 'true' && needs.plan.outputs.full_platforms == 'true'
    runs-on: windows-2022
    env:
      ZRLOG_EXPECTED_VERSION: ${{ needs.plan.outputs.version }}
      ZRLOG_EXPECTED_SOURCE_COMMIT: ${{ needs.plan.outputs.source_commit }}
      ZRLOG_CHANNEL: ${{ needs.plan.outputs.channel }}
      NATIVE_PLATFORM: Windows-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.source_commit }}

      - name: Download the exact completed Windows Native package
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.native_windows.outputs.package_artifact_id }}
          path: .native-package
          merge-multiple: true
      - name: Verify the actual Native package and prepare Docker context
        id: native
        shell: bash
        run: python3 docker/prepare-workflow-package.py .native-package .prepared-native
      - name: Login to Docker Hub
        if: needs.plan.outputs.publish == 'true'
        uses: docker/login-action@v4.6.0
        with:
          username: zrlog
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to Aliyun Docker Hub
        if: needs.plan.outputs.publish == 'true'
        uses: docker/login-action@v4.6.0
        with:
          registry: registry.cn-chengdu.aliyuncs.com
          username: 90xchun
          password: ${{ secrets.ALIYUN_DOCKER_PASSWORD }}

      - name: Build Windows image
        env:
          IMAGE_TAG: ${{ steps.native.outputs.image_tag }}-windows-ltsc2022
          IMAGE_ALIAS: ${{ needs.plan.outputs.channel == 'preview' && 'preview-windows-ltsc2022' || 'windows-ltsc2022' }}
        shell: pwsh
        run: |
          docker build --file docker/Dockerfile.windows.package `
            --build-arg "ZRLOG_EXPECTED_VERSION=$env:ZRLOG_EXPECTED_VERSION" `
            --build-arg "ZRLOG_SOURCE_COMMIT=$env:ZRLOG_EXPECTED_SOURCE_COMMIT" `
            --tag "${env:DOCKERHUB_IMAGE}:${env:IMAGE_TAG}" `
            --tag "${env:DOCKERHUB_IMAGE}:${env:IMAGE_ALIAS}" `
            --tag "${env:ALIYUN_IMAGE}:${env:IMAGE_TAG}" `
            --tag "${env:ALIYUN_IMAGE}:${env:IMAGE_ALIAS}" `
            .prepared-native/package
          if ($LASTEXITCODE -ne 0) { throw 'Windows Docker build failed' }
          "IMAGE_TAG=$env:IMAGE_TAG" >> $env:GITHUB_ENV
          "IMAGE_ALIAS=$env:IMAGE_ALIAS" >> $env:GITHUB_ENV

      - name: Verify Windows image
        env:
          EXPECTED_BUILD_ID: ${{ steps.native.outputs.build_id }}
        shell: pwsh
        run: |
          $output = docker run --rm `
            --entrypoint "C:/opt/zrlog/zrlog.exe" `
            "${env:DOCKERHUB_IMAGE}:${env:IMAGE_TAG}" `
            --version 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) {
            throw "zrlog.exe --version exited with code ${exitCode}"
          }
          $versionOutput = ($output -join [Environment]::NewLine).Trim().Replace(" version: ", " version:")
          $expectedPrefix = "zrlog.exe version:$env:ZRLOG_EXPECTED_VERSION - $env:EXPECTED_BUILD_ID "
          if (-not $versionOutput.StartsWith($expectedPrefix, [StringComparison]::Ordinal)) {
            throw "zrlog.exe --version did not report expected version $env:ZRLOG_EXPECTED_VERSION"
          }
          $image = "${env:DOCKERHUB_IMAGE}:${env:IMAGE_TAG}"
          $inspect = docker image inspect $image | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Windows Docker inspect failed' }
          if ($inspect[0].Config.Labels.'org.opencontainers.image.version' -ne $env:ZRLOG_EXPECTED_VERSION -or
              $inspect[0].Config.Labels.'org.opencontainers.image.revision' -ne $env:ZRLOG_EXPECTED_SOURCE_COMMIT) {
            throw 'Windows image source labels differ from its Native package'
          }
          $container = docker create $image
          if ($LASTEXITCODE -ne 0) { throw 'Windows Docker create failed' }
          try {
            docker cp "${container}:C:/opt/zrlog/zrlog.exe" .prepared-native/image-zrlog.exe
            if ($LASTEXITCODE -ne 0) { throw 'Windows Docker copy failed' }
            $expectedHash = ((Get-Content .prepared-native/native.sha256) -split ' ')[0]
            if ((Get-FileHash .prepared-native/image-zrlog.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedHash) {
              throw 'Windows image executable differs from its Native package'
            }
          } finally {
            docker rm $container | Out-Null
          }

      - name: Push Windows image
        if: needs.plan.outputs.publish == 'true'
        id: push
        shell: pwsh
        run: |
          function Push-Image([string] $Tag) {
            $output = docker push $Tag 2>&1
            $output | ForEach-Object { Write-Host $_ }
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to push ${Tag}"
            }
            $digestMatches = $output | Select-String -Pattern 'digest:\s+(sha256:[0-9a-f]{64})'
            if (-not $digestMatches) {
              throw "Docker did not report a digest for ${Tag}"
            }
            return $digestMatches[-1].Matches[0].Groups[1].Value
          }

          $dockerHubVersionTag = "${env:DOCKERHUB_IMAGE}:${env:IMAGE_TAG}"
          $dockerHubDigest = Push-Image $dockerHubVersionTag
          Push-Image "${env:DOCKERHUB_IMAGE}:${env:IMAGE_ALIAS}" | Out-Null
          $aliyunDigest = Push-Image "${env:ALIYUN_IMAGE}:${env:IMAGE_TAG}"
          Push-Image "${env:ALIYUN_IMAGE}:${env:IMAGE_ALIAS}" | Out-Null
          if ($dockerHubDigest -ne $aliyunDigest) {
            throw "Windows image digest differs between registries"
          }
          "dockerhub=${env:DOCKERHUB_IMAGE}@${dockerHubDigest}" >> $env:GITHUB_OUTPUT

      - uses: sigstore/cosign-installer@v3
        if: needs.plan.outputs.publish == 'true'

      - name: Sign canonical Windows image
        if: needs.plan.outputs.publish == 'true'
        run: cosign sign --yes "${{ steps.push.outputs.dockerhub }}"

      - name: Export Windows image archive
        if: needs.plan.outputs.publish != 'true'
        shell: pwsh
        run: |
          docker save --output .prepared-native/image.tar "${env:DOCKERHUB_IMAGE}:${env:IMAGE_TAG}"
          if ($LASTEXITCODE -ne 0) { throw 'Windows Docker save failed' }
          $hash = (Get-FileHash .prepared-native/image.tar -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  image.tar" | Set-Content .prepared-native/image.sha256
      - name: Preserve Windows image archive and Native inputs
        uses: actions/upload-artifact@v7
        with:
          name: docker-windows-amd64-${{ needs.plan.outputs.channel }}-${{ github.run_attempt }}
          path: |
            .prepared-native/image.tar
            .prepared-native/image.sha256
            .prepared-native/native-image-input.json
            .prepared-native/build.json
            .prepared-native/native.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
