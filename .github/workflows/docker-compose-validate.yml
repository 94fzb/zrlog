name: validate docker compose

on:
  pull_request:
    paths:
      - docker/**
      - shell/docker/**
      - .github/workflows/build-package.yml
      - .github/workflows/docker-compose-validate.yml
  push:
    branches:
      - master
    paths:
      - docker/**
      - shell/docker/**
      - .github/workflows/build-package.yml
      - .github/workflows/docker-compose-validate.yml

permissions:
  contents: read

jobs:
  validate:
    name: Validate Docker Compose configuration
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify Native package pinning contract
        run: bash shell/docker/test-native-package-contract.sh

      - name: Verify exact workflow package inputs for all Docker platforms
        run: python3 shell/docker/test-workflow-package.py

      - name: Verify Docker image metadata
        run: bash shell/docker/test-image-manifest.sh

      - name: Validate configuration
        run: bash shell/docker/test-compose-updater-config.sh
