name: validate docker compose

on:
  pull_request:
    paths:
      - docker/Dockerfile
      - docker/Dockerfile.windows
      - docker/docker-compose.yml
      - docker/docker-compose.updater.yml
      - docker/test-compose-updater-config.sh
      - docker/.env.example
      - docker/resolve-native-package.sh
      - docker/test-native-package-contract.sh
      - .github/workflows/docker-preview-publish.yml
      - .github/workflows/docker-release-publish.yml
      - .github/workflows/docker-compose-validate.yml
  push:
    branches:
      - master
    paths:
      - docker/Dockerfile
      - docker/Dockerfile.windows
      - docker/docker-compose.yml
      - docker/docker-compose.updater.yml
      - docker/test-compose-updater-config.sh
      - docker/.env.example
      - docker/resolve-native-package.sh
      - docker/test-native-package-contract.sh
      - .github/workflows/docker-preview-publish.yml
      - .github/workflows/docker-release-publish.yml
      - .github/workflows/docker-compose-validate.yml

permissions:
  contents: read

jobs:
  validate:
    name: Validate Docker Compose configuration
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify Native package pinning contract
        run: bash docker/test-native-package-contract.sh

      - name: Validate configuration
        run: bash docker/test-compose-updater-config.sh
