name: Docker updater checks
on:
  pull_request:
    paths: ['docker/**', '.github/workflows/docker-updater-checks.yml', 'shell/release/*sources*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  updater:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: graalvm
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: JVM, HTTP and isolated Docker contract tests
        env:
          ZRLOG_UPDATER_REAL_DOCKER: '1'
        run: ./mvnw -B -f docker/updater/pom.xml package
      - name: Native build and real binary smoke
        run: |
          ./mvnw -B -f docker/updater/pom.xml -Pnative -DskipTests package
          python3 docker/updater/smoke-native.py docker/updater/target/zrlog-updater
          docker build --tag zrlog-updater:ci docker/updater
          docker run --rm zrlog-updater:ci --version
      - name: Metadata and publication contract tests
        run: |
          python3 docker/test_image_manifest.py
          python3 shell/release/test_update_sources.py
          bash docker/test-native-package-contract.sh
