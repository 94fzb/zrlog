name: verify release package download sources
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: release-package-source-metadata
  cancel-in-progress: false
jobs:
  verify-sources:
    if: github.event.release.draft == false && github.event.release.prerelease == false
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Read actual public Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > public-release.json
      - name: Verify identical bytes before advertising GitHub and dl
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SECRET_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_KEY }}
          ZRLOG_S3_BUCKET: ${{ secrets.BUCKET }}
          ZRLOG_S3_ENDPOINT: ${{ secrets.HOST }}
        run: |
          python3 -m pip install 'boto3>=1.40,<2'
          python3 shell/release/publish-update-sources.py \
            --release public-release.json --commit "$(git rev-parse HEAD)"
