name: build faas release package
on:
  push:
    branches: [release]
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  build:
    uses: ./.github/workflows/build-package.yml
    with:
      package_type: faas
      source_commit: ${{ github.sha }}
      channel: release
      full_platforms: true
      publish: true
    secrets:
      SECRET_ID: ${{ secrets.SECRET_ID }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      BUCKET: ${{ secrets.BUCKET }}
      HOST: ${{ secrets.HOST }}
      ARTIFACT_SERVICE_TOKEN: ${{ secrets.ARTIFACT_SERVICE_TOKEN }}
