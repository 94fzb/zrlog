name: build faas release package
on:
  push:
    branches:
      - release
jobs:
  build:
    name: ZrLog on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      ARTIFACT_SERVICE_URL: ${{ vars.ARTIFACT_SERVICE_URL }}
      ARTIFACT_SERVICE_TOKEN: ${{ secrets.ARTIFACT_SERVICE_TOKEN }}
      ARTIFACT_SOURCE_PREFIX: zrlog
      ARTIFACT_R2_ACCESS_KEY_ID: ${{ secrets.SECRET_ID }}
      ARTIFACT_R2_SECRET_ACCESS_KEY: ${{ secrets.SECRET_KEY }}
      ARTIFACT_R2_BUCKET: ${{ secrets.BUCKET }}
      ARTIFACT_R2_ENDPOINT: ${{ secrets.HOST }}
    concurrency:
      group: deploy-release-on-${{ matrix.os }}-faas   # 同一个 group 的任务会排队执行
      cancel-in-progress: false # 不取消前一个任务，而是等待
    strategy:
      matrix:
        os: [ ubuntu-22.04,ubuntu-24.04-arm ]
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm' # See 'Options' for all available distributions
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'

      - name: Build and upload binary
        run: |
          mkdir -p /tmp/download
          bash -e shell/native/build-final-native.sh release /tmp/download faas
          bash -e shell/upload-bin.sh ${{ secrets.SECRET_ID }} ${{ secrets.SECRET_KEY }} ${{ secrets.BUCKET }} /tmp/download release ${{ secrets.HOST }}
